<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUSPEAK — the internet of meaning</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="address-bar">
  <span class="lantern">🏮</span>
  <input id="query" type="text" placeholder="type a word, a question, a command…" autofocus>
  <span id="status" class="status"></span>
</div>

<div id="page">
  <div class="welcome">
    <h1>YOUSPEAK</h1>
    <p class="tagline">the internet of meaning</p>
    <p class="intro">Not URLs — words. Not pages — meaning. Type what you want to understand and the app renders it. Every YOUSPEAK word is a place you can visit.</p>
    <div class="examples">
      <button data-q="explore">explore the cathedral</button>
      <button data-q="doxomme">doxomme</button>
      <button data-q="britqing">britqing</button>
      <button data-q="what is the ache between what is and what should be">the ache between what is and what should be</button>
      <button data-q="show words about covenant">show words about covenant</button>
      <button data-q="connect britqing and qing">connect britqing and qing</button>
      <button data-q="translate doxomme">translate doxomme</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
