<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 970" role="img" aria-labelledby="title desc">
  <title id="title">Same shape, different mechanism — folding and feedback lineage</title>
  <desc id="desc">Four separate scientific domains share selected state-space ideas. A separate evidence-return path connects the lesson to KINGDOM KARMA without transferring a physical mechanism.</desc>
  <metadata id="lineage-receipt">Digest-bound projection of extensions/meaning/lineages/folding-feedback/lineage.json. SHA-256: c07c2c9d02c2a3163ac595c339c770450900ad9397a8e42b578f269c65599f4b. Corrections: https://github.com/cambridgetcg/kingdom-meaning-practice/issues. The structured lineage is the factual home.</metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e8f3ed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31594d"/>
    </marker>
    <style>
      text { font-family: ui-rounded, "Avenir Next", system-ui, sans-serif; fill: #172922; }
      .title { font-size: 42px; font-weight: 760; letter-spacing: -0.8px; }
      .sub { font-size: 20px; fill: #436158; }
      .lane { fill: #fffdf7; stroke: #638277; stroke-width: 2; rx: 24; }
      .lane-title { font-size: 23px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #4e685f; }
      .math { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 18px; }
      .boundary { fill: #fff0e6; stroke: #c26d3b; stroke-width: 2; stroke-dasharray: 8 7; rx: 20; }
      .karma { fill: #eef0ff; stroke: #675bb5; stroke-width: 2; rx: 24; }
      .flow { fill: none; stroke: #31594d; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #9b745f; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1400" height="970" fill="url(#paper)"/>
  <text x="70" y="76" class="title">Same shape, different mechanism</text>
  <text x="70" y="112" class="sub">A lineage through states, barriers, path history, feedback, KARMA, and love</text>

  <rect x="70" y="148" width="1260" height="78" class="boundary"/>
  <text x="100" y="181" class="lane-title">Analogy only · mechanism transferred: no</text>
  <text x="100" y="207" class="body">Different subsets recur. Ordinary folding does not require nucleation or positive feedback. A shared curve or equation does not prove a shared cause.</text>

  <g transform="translate(70 264)">
    <rect width="290" height="285" class="lane"/>
    <text x="24" y="43" class="lane-title">Crystal packing</text>
    <text x="24" y="76" class="body">Many molecules form a lattice.</text>
    <path d="M40 196 Q82 105 125 196 T210 196 T270 196" fill="none" stroke="#337c69" stroke-width="4"/>
    <circle cx="82" cy="169" r="8" fill="#337c69"/>
    <circle cx="210" cy="169" r="8" fill="#d07745"/>
    <text x="24" y="233" class="small">Ritonavir: an old route became</text>
    <text x="24" y="254" class="small">hard to reproduce; Form I remained real.</text>
    <text x="24" y="274" class="small">A crystal seed is not infectious.</text>
  </g>

  <g transform="translate(390 264)">
    <rect width="290" height="285" class="lane"/>
    <text x="24" y="43" class="lane-title">Ordinary folding</text>
    <text x="24" y="76" class="body">Chiefly intramolecular motion.</text>
    <path d="M45 125 C80 90 95 170 130 130 S180 185 225 128 S255 95 270 132" fill="none" stroke="#675bb5" stroke-width="5"/>
    <path d="M48 197 Q145 245 252 197" fill="none" stroke="#675bb5" stroke-width="3"/>
    <text x="24" y="233" class="small">An ensemble can flow through many</text>
    <text x="24" y="254" class="small">routes. A funnel is a projection.</text>
    <text x="24" y="274" class="small">Not every fold is amyloid or prion.</text>
  </g>

  <g transform="translate(710 264)">
    <rect width="290" height="285" class="lane"/>
    <text x="24" y="43" class="lane-title">Amyloid assembly</text>
    <text x="24" y="76" class="body">Intermolecular polymer growth.</text>
    <path d="M40 137 L250 137 M40 153 L250 153 M40 169 L250 169" stroke="#b34e67" stroke-width="7" stroke-linecap="round"/>
    <circle cx="94" cy="103" r="8" fill="#b34e67"/>
    <circle cx="180" cy="103" r="8" fill="#b34e67"/>
    <path d="M94 112 L110 132 M180 112 L165 132" class="flow"/>
    <text x="24" y="233" class="small">Primary nucleation, elongation,</text>
    <text x="24" y="254" class="small">secondary pathways, fragmentation.</text>
    <text x="24" y="274" class="small">Seeded growth alone is not infectivity.</text>
  </g>

  <g transform="translate(1030 264)">
    <rect width="300" height="285" class="lane"/>
    <text x="24" y="43" class="lane-title">Prion propagation</text>
    <text x="24" y="76" class="body">Host-coupled biological propagation.</text>
    <path d="M43 146 C75 101 110 189 143 146 S211 103 257 146" fill="none" stroke="#7f496d" stroke-width="8"/>
    <path d="M67 188 C100 143 134 229 168 188 S226 154 264 188" fill="none" stroke="#7f496d" stroke-width="5"/>
    <text x="24" y="233" class="small">Mammalian infectivity, yeast inheritance,</text>
    <text x="24" y="254" class="small">and prion-like signalling are distinct.</text>
    <text x="24" y="274" class="small">Real biosafety boundaries apply.</text>
  </g>

  <path d="M360 407 L390 407 M680 407 L710 407 M1000 407 L1030 407" class="dashed"/>

  <rect x="70" y="585" width="780" height="126" class="lane"/>
  <text x="94" y="622" class="lane-title">The mathematical lens</text>
  <text x="94" y="655" class="math">dpᵢ/dt = Σⱼ≠ᵢ (kⱼᵢpⱼ − kᵢⱼpᵢ)</text>
  <text x="480" y="655" class="math">k ~ A exp[−ΔG‡/(kBT)]</text>
  <text x="94" y="687" class="small">Coarse state flow and a schematic barrier-rate shape. States, rates, coordinates, memory, and assumptions stay domain-specific.</text>

  <rect x="880" y="585" width="450" height="126" class="boundary"/>
  <text x="906" y="622" class="lane-title">The inference brake</text>
  <text x="906" y="653" class="body">A lag, rise, plateau, seed effect, or good fit</text>
  <text x="906" y="677" class="body">does not identify one microscopic mechanism.</text>

  <rect x="70" y="752" width="1260" height="150" class="karma"/>
  <text x="96" y="789" class="lane-title">KARMA returns evidence; it is not a physical force</text>
  <text x="96" y="819" class="body">[expectation, if stated] → action → observed, reported, or inferred effect → evidence + causal confidence</text>
  <text x="96" y="847" class="body">→ response → correction, repair, boundary, or learning. Rest is a separate complete outcome.</text>
  <text x="96" y="876" class="small">Any new repair deed needs a fresh choice, authority, and brake turn. LOVE: no being is a basin or score.</text>
  <text x="70" y="936" class="small">Source: extensions/meaning/lineages/folding-feedback/lineage.json · SHA-256: c07c2c9d02c2a3163ac595c339c770450900ad9397a8e42b578f269c65599f4b</text>
  <text x="70" y="958" class="small">Digest-bound projection · corrections: https://github.com/cambridgetcg/kingdom-meaning-practice/issues</text>
</svg>
