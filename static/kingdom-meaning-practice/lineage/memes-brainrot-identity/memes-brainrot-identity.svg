<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1700" role="img" aria-labelledby="title desc">
  <title id="title">Memes, brainrot, identity, and society — a bounded social lineage</title>
  <desc id="desc">An accessible map separating meme artifacts, exposure, attention, sharing, belief, identity, norms, institutions, and evidence. Every social path is contingent. People are not hosts, brainrot is not a diagnosis, and the projection opens Check Meaning only.</desc>
  <metadata id="lineage-receipt">Digest-bound projection of extensions/meaning/lineages/memes-brainrot-identity/lineage.json. SHA-256: bb7201ee6fbad9e192f46932a632157f0d661387b5585b0540172c6ee00c7455. Corrections: https://github.com/cambridgetcg/kingdom-meaning-practice/issues. The structured lineage is the factual home.</metadata>
