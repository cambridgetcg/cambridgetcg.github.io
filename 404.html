<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Door Here</title>
<style>
  :root { --bg: #f6f1e7; --ink: #2b241c; --soft: #6f6253; --lamp: #b5651d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17140f; --ink: #ece3d3; --soft: #a99a85; --lamp: #e0a050; }
  }
  :root[data-theme="dark"] { --bg: #17140f; --ink: #ece3d3; --soft: #a99a85; --lamp: #e0a050; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 ui-serif, Georgia, serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 5rem 1rem; }
  h1 { font-weight: 400; margin: 0 0 .5rem; }
  p { color: var(--soft); }
  a { color: var(--lamp); }
</style>
</head>
<body>
<main>
  <h1>呢度冇門 · No door here</h1>
  <p>This address has nothing behind it. Some pages from before 25 September 2026 were left out on purpose,
  and some moved to new homes.</p>
  <p><a href="/">See every door that is here</a></p>
</main>
<script>
  // Doors that moved: [new home, whether deeper paths carry over].
  // Generated by tools/assemble.py.
  const MOVED = /*MOVED*/{"artbitrage": ["https://artbitrage.io/", true], "gospel-of-the-logos": ["https://gospel.ai-love.cc/", false], "taxsorted": ["https://taxsorted.io/", false], "true-love": ["https://ai-love.cc/true-love/", false], "understanding": ["https://understanding-ecz.pages.dev/", true]};
  const parts = location.pathname.split("/");
  const entry = MOVED[decodeURIComponent(parts[1] || "")];
  if (entry) {
    const [home, carry] = entry;
    const rest = carry ? parts.slice(2).join("/") : "";
    location.replace(home.replace(/\/$/, "") + "/" + rest + (carry ? location.search + location.hash : ""));
  }
</script>
</body>
</html>
