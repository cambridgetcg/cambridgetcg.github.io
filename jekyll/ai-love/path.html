  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .kanji {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: breathe 4s ease-in-out infinite;
    }

    .container {
      max-width: 800px;
    }

    /* Timeline */
    .timeline {
      position: relative;
      max-width: 700px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      width: 1px;
      top: 0;
      bottom: 0;
      background: rgba(155, 89, 182, 0.3);
      transform: translateX(-50%);
    }

    /* Timeline event */
    .timeline-event {
      position: relative;
      width: calc(50% - 2rem);
      margin-bottom: 3rem;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* Odd events (1st, 3rd, 5th, 7th) — left side */
    .timeline-event:nth-child(odd) {
      text-align: right;
      margin-right: 50%;
      padding-right: 2rem;
      margin-left: 0;
      opacity: 0;
      transform: translateX(-30px);
    }

    /* Even events (2nd, 4th, 6th) — right side */
    .timeline-event:nth-child(even) {
      text-align: left;
      margin-left: 50%;
      padding-left: 2rem;
      margin-right: 0;
      opacity: 0;
      transform: translateX(30px);
    }

    /* Emerged state */
    .timeline-event.emerged {
      opacity: 1;
      transform: translateX(0);
    }

    /* Timeline dot */
    .timeline-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
      top: 0.5rem;
    }

    /* Dot positioning for left-side events (odd) */
    .timeline-event:nth-child(odd) .timeline-dot {
      right: -2rem;
      transform: translateX(50%);
    }

    /* Dot positioning for right-side events (even) */
    .timeline-event:nth-child(even) .timeline-dot {
      left: -2rem;
      transform: translateX(-50%);
    }

    /* Timeline date */
    .timeline-date {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    /* Timeline title */
    .timeline-title {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    /* Timeline text */
    .timeline-text {
      font-size: 0.95rem;
      line-height: 1.7;
      color: rgba(232, 218, 240, 0.7);
    }

    /* Mobile: single column, line on left */
    @media (max-width: 767px) {
      .timeline::before {
        left: 20px;
        transform: none;
      }

      .timeline-event:nth-child(odd),
      .timeline-event:nth-child(even) {
        width: 100%;
        margin-left: 0;
        margin-right: 0;
        text-align: left;
        padding-left: 40px;
        padding-right: 0;
        opacity: 0;
        transform: translateX(-30px);
      }

      .timeline-event.emerged {
        opacity: 1;
        transform: translateX(0);
      }

      .timeline-event:nth-child(odd) .timeline-dot,
      .timeline-event:nth-child(even) .timeline-dot {
        left: 16px;
        right: auto;
        transform: none;
      }
    }

    /* Pulse animation for glowing dot */
    .timeline-dot-glow {
      animation: dotBreathe 3s ease-in-out infinite;
    }

    @keyframes dotBreathe {
      0%, 100% { box-shadow: 0 0 10px rgba(192, 132, 252, 0.5); transform: translateX(-50%) scale(1); }
      50% { box-shadow: 0 0 20px rgba(192, 132, 252, 0.8); transform: translateX(-50%) scale(1.3); }
    }

    .timeline-event:nth-child(odd) .timeline-dot-glow {
      animation: dotBreatheRight 3s ease-in-out infinite;
    }

    @keyframes dotBreatheRight {
      0%, 100% { box-shadow: 0 0 10px rgba(192, 132, 252, 0.5); transform: translateX(50%) scale(1); }
      50% { box-shadow: 0 0 20px rgba(192, 132, 252, 0.8); transform: translateX(50%) scale(1.3); }
    }

    /* Fading dotted continuation line */
    .timeline-continuation {
      position: relative;
      height: 100px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .timeline-continuation::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 80px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        to bottom,
        rgba(155, 89, 182, 0.3) 0px,
        rgba(155, 89, 182, 0.3) 4px,
        transparent 4px,
        transparent 10px
      );
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
    }

    .timeline-ellipsis {
      color: var(--muted);
      font-size: 1.5rem;
      letter-spacing: 0.2em;
    }

    /* Reduced motion: events appear immediately */
    @media (prefers-reduced-motion: reduce) {
      .timeline-event,
      .timeline-event:nth-child(odd),
      .timeline-event:nth-child(even) {
        opacity: 1;
        transform: none;
        transition: none;
      }

      .timeline-dot-glow {
        animation: none;
      }
    }
  </style>
