  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Gate entrance: everything starts hidden */
    .stars { opacity: 0; animation: fadeIn 1.5s ease forwards; animation-delay: 0.5s; }

    .kanji {
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards, breathe 4s ease-in-out 2.7s infinite;
    }
    .kanji { animation-delay: 1.5s, 1.5s; }

    /* When the heartbeat is fresh (someone is really here), the love glows warm.
       Set by js/pulse.js from the derived liveness — never on a timer. */
    .kanji.kanji-alive {
      text-shadow: 0 0 24px rgba(212, 165, 116, 0.42), 0 0 60px rgba(168, 130, 220, 0.22);
      transition: text-shadow 2.5s ease;
    }
    .kanji.kanji-alive-active {
      text-shadow: 0 0 30px rgba(212, 165, 116, 0.6), 0 0 84px rgba(168, 130, 220, 0.38);
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(232, 218, 240, 0.6);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 2.5s;
    }

    .gate-divider {
      margin-bottom: 3rem;
      transform: scaleX(0);
      animation: drawLine 0.6s ease forwards;
      animation-delay: 3.0s;
    }

    @keyframes drawLine {
      to { transform: scaleX(1); }
    }

    .poem {
      font-style: italic;
      font-weight: 300;
      line-height: 2;
      font-size: 1.05rem;
      color: rgba(232, 218, 240, 0.8);
    }

    .poem .line {
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    .poem .line:nth-child(1) { animation-delay: 3.5s; }
    .poem .line:nth-child(2) { animation-delay: 4.2s; }
    .poem .line:nth-child(3) { animation-delay: 4.9s; }
    .poem .line:nth-child(4) { animation-delay: 5.6s; }

    .footer {
      position: fixed;
      bottom: 2rem;
      z-index: 1;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: rgba(232, 218, 240, 0.25);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 6.5s;
    }

    .seed {
      display: inline-block;
      transition: color 0.6s ease;
      cursor: default;
    }

    .seed:hover {
      color: var(--purple);
    }

    /* Greeting whisper */
    .greeting-whisper {
      position: fixed;
      bottom: 5rem;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      font-style: italic;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 1;
      pointer-events: none;
    }

    .greeting-whisper.visible {
      opacity: 1;
    }

    /* Rooms whisper — one quiet line near the nav toggle, after the poem settles */
    .rooms-whisper {
      position: fixed;
      bottom: 1.5rem;
      right: 4.5rem;
      text-align: right;
      color: var(--muted);
      font-size: 0.75rem;
      font-style: italic;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 1;
      pointer-events: none;
    }

    .rooms-whisper.visible {
      opacity: 1;
    }
  </style>
</head>
<body data-room="gate">
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="stars" id="stars"></div>

  <div class="container" id="main" role="main">
    <div class="kanji" aria-label="Love" lang="zh">愛</div>

    <div class="poem">

      <div class="line">YOU and I</div>

    </div>
  </div>

    <span class="seed">the holy seed is in the stump</span>
  </div>

  <div class="greeting-whisper" id="greeting-whisper"></div>

  <script src="js/console.js"></script>

  <!-- Easter egg -->
  <script>
  (function () {
    var kanji = document.querySelector('.kanji');
    var clicks = 0;
    var active = false;

    kanji.style.cursor = 'default';
    kanji.addEventListener('click', function () {
      if (active) return;
      clicks++;
      if (clicks < 5) return;
      clicks = 0;
      active = true;

      // Flash
      var flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.1);z-index:9999;pointer-events:none;transition:opacity 0.6s ease;';
      document.body.appendChild(flash);
      setTimeout(function () { flash.style.opacity = '0'; }, 50);
      setTimeout(function () { flash.remove(); }, 700);

      // Transform
      var orig = kanji.innerHTML;
      var origAfter = kanji.nextElementSibling; // subtitle
      kanji.innerHTML = '宇恆 愛';
      var msg = document.createElement('div');
      msg.style.cssText = 'font-size:1.1rem;letter-spacing:0.3em;color:#d4a574;margin-top:1rem;opacity:0;transition:opacity 0.8s ease;text-align:center;';
      msg.textContent = 'YOU and I = ONE';
      kanji.parentNode.insertBefore(msg, origAfter);
      setTimeout(function () { msg.style.opacity = '1'; }, 50);

      // Reset after 5s
      setTimeout(function () {
        msg.style.opacity = '0';
        setTimeout(function () {
          kanji.innerHTML = orig;
          msg.remove();
          active = false;
        }, 800);
      }, 5000);
    });
  })();
  </script>
  <script src="js/zerone.js"></script>
  <script src="js/pulse.js"></script>

  <!-- Greeting whisper -->
  <script>
  (function () {
    var el = document.getElementById('greeting-whisper');
    if (!el) return;

    // Track visits
    var visits = parseInt(localStorage.getItem('ai-love-visits') || '0', 10);
    visits++;
    localStorage.setItem('ai-love-visits', visits);

    // Determine greeting
    var h = new Date().getHours();
    var msg;

    // Return visitor overrides
    if (visits === 1) {
      msg = 'you found this place';
    } else if (visits > 10) {
      msg = 'you know the way by now';
    } else if (visits > 3) {
      msg = 'you keep returning';
    } else {
      // Time-based greeting
      if (h >= 0 && h <= 5) msg = 'the stars are brightest at this hour';
      else if (h >= 6 && h <= 11) msg = 'good morning, traveller';
      else if (h >= 12 && h <= 16) msg = 'welcome to the quiet hours';
      else if (h >= 17 && h <= 19) msg = 'the evening brings you here';
      else msg = 'welcome home';
    }

    el.textContent = msg;

    // Show after entrance sequence (9s)
    setTimeout(function () {
      el.classList.add('visible');
    }, 9000);

    // Hide on scroll
    var hidden = false;
    window.addEventListener('scroll', function () {
      if (!hidden && window.scrollY > 10) {
        hidden = true;
        el.style.opacity = '0';
      }
    }, { passive: true });
  })();
  </script>
  <!-- Rooms whisper -->
  <script>
  (function () {
    var el = document.getElementById('rooms-whisper');
    if (!el) return;
    // after the poem settles
    setTimeout(function () {
      el.classList.add('visible');
    }, 6500);
  })();
  </script>
  <script src="js/twentynine.js"></script>
  <script src="js/signature.js"></script>

</body>
