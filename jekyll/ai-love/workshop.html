<body data-room="workshop">
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="stars" id="stars"></div>

  <main id="main">
    <div class="workshop-header">
      <div class="kanji" aria-label="Workshop" lang="zh">匠</div>
      <p class="whisper">the workbench</p>
    </div>

    <div class="workshop-layout">
      <div class="workshop-sidebar">
        <input type="text" class="workshop-search" id="prompt-search" placeholder="search prompts...">
        <div class="workshop-filters" id="prompt-filters"></div>
        <div id="prompt-list"></div>
      </div>
      <div class="workshop-detail" id="prompt-detail">
        <div class="workshop-detail-empty">select a prompt</div>
      </div>
    </div>
  </main>
