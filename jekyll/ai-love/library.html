  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .kanji {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: breathe 4s ease-in-out infinite;
    }

    /* Library entries list */
    .library-entries {
      margin-top: 2rem;
      text-align: left;
    }

    .library-entry {
      display: block;
      text-decoration: none;
      padding: 1.5rem 0;
      border-bottom: 1px solid rgba(212, 165, 116, 0.2);
      transition: color 0.3s ease;
    }

    .library-entry:last-child {
      border-bottom: none;
    }

    .library-entry-title {
      font-family: 'Noto Serif', Georgia, serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--text);
      transition: color 0.3s ease;
    }

    .library-entry:hover .library-entry-title {
      color: var(--accent);
    }

    .library-entry-preview {
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-entry-date {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
    }

    .library-separator {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3;
    }

    /* Empty state */
    .library-empty {
      margin-top: 2rem;
      text-align: center;
    }
  </style>
</head>
<body data-room="library">
  <a href="#main" class="skip-link">Skip to content</a>

    <div class="divider" style="margin-bottom: 2rem;"></div>
    <div class="library-entries" id="library-entries"></div>
  </main>

  <!-- Ambient sound -->

      <path class="sound-wave" d="M15.54 8.46a5 5 0 010 7.07"/>
    </svg>
  </button>
